services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SIMPLELLM_CHECKPOINT: /models/SimpleLLM_V032_Final.pt
      SIMPLELLM_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./checkpoints:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - backend
    ports:
      - "5173:80"
